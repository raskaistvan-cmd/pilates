<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenisz nap - Pilates Regisztráció</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .timeslots {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .timeslot {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .timeslot:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .timeslot-time {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }

        .timeslot-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .slot-count {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .slot-count label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .slot-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .slot-number.full {
            color: #e74c3c;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .register-btn:hover:not(:disabled) {
            background: #764ba2;
        }

        .register-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .participants {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .participants-title {
            font-size: 1em;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .participant-list {
            max-height: 250px;
            overflow-y: auto;
        }

        .participant {
            font-size: 0.95em;
            padding: 10px 10px;
            margin-bottom: 8px;
            color: #333;
            border-bottom: none;
            border-radius: 6px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .participant:hover {
            background: #f0f0f5;
        }

        .participant:last-child {
            border-bottom: none;
        }

        .participant-name {
            font-weight: 600;
            color: #667eea;
        }

        .participant-info {
            flex: 1;
        }

        .participant-email {
            font-size: 0.85em;
            color: #999;
            margin-top: 3px;
        }

        .remove-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.8em;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .participant:hover .remove-btn {
            opacity: 1;
        }

        .remove-btn:hover {
            background: #c0392b;
        }

        .remove-btn.hidden {
            display: none;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-buttons .confirm-btn {
            background: #667eea;
            color: white;
        }

        .modal-buttons .confirm-btn:hover {
            background: #764ba2;
        }

        .modal-buttons .cancel-btn {
            background: #eee;
            color: #333;
        }

        .modal-buttons .cancel-btn:hover {
            background: #ddd;
        }

        /* Export section */
        .export-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .export-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .export-btn {
            padding: 12px 30px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }

        .export-btn:hover {
            background: #229954;
        }

        .reset-btn {
            padding: 12px 30px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }

        .reset-btn:hover {
            background: #c0392b;
        }

        .admin-toggle-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .admin-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .admin-controls {
            display: none;
        }

        .admin-controls.active {
            display: block;
        }

        .logout-btn {
            padding: 8px 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .stats {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .status-message {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .timeslots {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <!-- Google Apps Script API URL -->
    <script>
        // Az API URL az Apps Script deployment-ből
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKQlOgpBd0pezdpuZet9UGzd6bYV85h1xJNALYtjRWyOxd6R35m5b-qqDQJKCq9Xjv/exec';
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎾 Tenisz nap - Pilates óra</h1>
            <p>Regisztrálj az alábbi időpontok közül</p>
            <div style="margin-top: 15px;">
                <button id="adminToggleBtn" class="admin-toggle-btn" onclick="toggleAdminPanel()">🔐 Admin belépés</button>
                <span id="adminStatus" style="color: #fff; margin-left: 10px; display: none;">✅ Admin mód aktív</span>
            </div>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="timeslots" id="timeslots"></div>

        <div class="export-section">
            <h3>📊 Regisztrációs adatok</h3>

            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="total-registered">0</div>
                    <div class="stat-label">Össz. regisztrált</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="total-slots">18</div>
                    <div class="stat-label">Össz. hely</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="remaining-slots">18</div>
                    <div class="stat-label">Szabad hely</div>
                </div>
            </div>

            <div id="adminControls" class="admin-controls">
                <hr style="margin: 20px 0; border: none; border-top: 2px solid #f0f0f0;">
                <h4 style="color: #667eea; margin-bottom: 15px;">🔐 Admin Funkciók</h4>
                <button class="export-btn" onclick="exportToCSV()">📥 Letöltés (CSV)</button>
                <button class="export-btn" onclick="copyToClipboard()">📋 Másolás (Sheets-hez)</button>
                <button class="reset-btn" onclick="resetAll()">🔄 Összes törlése</button>
                <button class="logout-btn" onclick="logoutAdmin()">🔓 Kijelentkezés</button>
            </div>
        </div>
    </div>

    <!-- Regisztrációs modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle"></div>
            <form onsubmit="submitRegistration(event)">
                <div class="form-group">
                    <label for="nameInput">Név *</label>
                    <input type="text" id="nameInput" required placeholder="pl. Kiss János">
                </div>
                <div class="form-group">
                    <label for="emailInput">Email (opcionális)</label>
                    <input type="email" id="emailInput" placeholder="janos@example.com">
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="confirm-btn">Regisztrálok</button>
                    <button type="button" class="cancel-btn" onclick="closeModal()">Mégse</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">🔐 Admin Belépés</div>
            <form onsubmit="submitAdminPassword(event)">
                <div class="form-group">
                    <label for="adminPassword">Jelszó</label>
                    <input type="password" id="adminPassword" required placeholder="Add meg az admin jelszót" autofocus>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="confirm-btn">Belépés</button>
                    <button type="button" class="cancel-btn" onclick="closeAdminModal()">Mégse</button>
                </div>
            </form>
            <div id="adminError" style="color: #e74c3c; margin-top: 15px; text-align: center; display: none;">
                ❌ Hibás jelszó! Próbáld újra.
            </div>
        </div>
    </div>

    <script>
        // Adatstruktúra
        const TIMESLOTS = [
            { id: 0, time: '9:00-9:50', maxSlots: 6 },
            { id: 1, time: '10:00-10:50', maxSlots: 6 },
            { id: 2, time: '11:00-11:50', maxSlots: 6 }
        ];

        let registrations = {};
        let currentSlotId = null;
        let isAdminMode = false;
        const ADMIN_PASSWORD = 'admin123';

        // Status üzenet megjelenítése
        function showStatus(message, type = 'success') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            setTimeout(() => {
                statusEl.className = 'status-message';
            }, 3000);
        }

        // Inicializálás
        async function init() {
            await loadData();
            renderTimeslots();
            updateStats();
            updateAdminUI();
        }

        // Admin panel megnyitása
        function toggleAdminPanel() {
            document.getElementById('adminModal').classList.add('active');
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminError').style.display = 'none';
        }

        // Admin modal bezárása
        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminError').style.display = 'none';
        }

        // Admin jelszó ellenőrzése
        function submitAdminPassword(e) {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;

            if (password === ADMIN_PASSWORD) {
                isAdminMode = true;
                closeAdminModal();
                updateAdminUI();
                showStatus('✅ Admin mód aktiválva!');
            } else {
                document.getElementById('adminError').style.display = 'block';
                document.getElementById('adminPassword').value = '';
                document.getElementById('adminPassword').focus();
            }
        }

        // Admin felület frissítése
        function updateAdminUI() {
            const adminControls = document.getElementById('adminControls');
            const adminToggleBtn = document.getElementById('adminToggleBtn');
            const adminStatus = document.getElementById('adminStatus');
            const removeButtons = document.querySelectorAll('.remove-btn');

            if (isAdminMode) {
                adminControls.classList.add('active');
                adminToggleBtn.textContent = '✅ Admin mód aktív';
                adminStatus.style.display = 'inline-block';
                removeButtons.forEach(btn => btn.classList.remove('hidden'));
            } else {
                adminControls.classList.remove('active');
                adminToggleBtn.textContent = '🔐 Admin belépés';
                adminStatus.style.display = 'none';
                removeButtons.forEach(btn => btn.classList.add('hidden'));
            }
        }

        // Admin kijelentkezés
        function logoutAdmin() {
            if (confirm('Biztosan kijelentkezel az admin módból?')) {
                isAdminMode = false;
                updateAdminUI();
                showStatus('🔓 Kijelentkeztél');
            }
        }

        // Adatok betöltése Google Sheet-ből
        async function loadData() {
            try {
                const response = await fetch(APPS_SCRIPT_URL + '?action=getAll');
                const data = await response.json();
                registrations = data;
                console.log('✅ Adatok betöltve a Google Sheet-ből');
            } catch (error) {
                console.log('⚠️ Offline mód - localStorage használata:', error);
                const stored = localStorage.getItem('pilatesRegistrations');
                if (stored) {
                    registrations = JSON.parse(stored);
                } else {
                    TIMESLOTS.forEach(slot => {
                        registrations[slot.id] = [];
                    });
                }
            }
        }

        // Adatok mentése (lokális backup)
        function saveData() {
            localStorage.setItem('pilatesRegistrations', JSON.stringify(registrations));
            updateStats();
        }

        // Render timeslots
        function renderTimeslots() {
            const container = document.getElementById('timeslots');
            container.innerHTML = '';

            TIMESLOTS.forEach(slot => {
                const registered = registrations[slot.id] || [];
                const available = slot.maxSlots - registered.length;
                const isFull = available <= 0;

                const slotDiv = document.createElement('div');
                slotDiv.className = 'timeslot';
                slotDiv.innerHTML = `
                    <div class="timeslot-time">⏰ ${slot.time}</div>
                    <div class="timeslot-info">
                        <div class="slot-count">
                            <label>Szabad helyek</label>
                            <div class="slot-number ${isFull ? 'full' : ''}">${available}/${slot.maxSlots}</div>
                        </div>
                    </div>
                    <button class="register-btn" onclick="openModal(${slot.id})" ${isFull ? 'disabled' : ''}>
                        ${isFull ? '❌ MEGTELT' : '✅ REGISZTRÁLOK'}
                    </button>
                    <div class="participants">
                        <div class="participants-title">👥 Regisztráltak (${registered.length})</div>
                        <div class="participant-list" id="list-${slot.id}">
                            ${registered.length === 0 ? '<div style="color: #999; font-size: 0.9em; padding: 10px 0; text-align: center;">Még senki sem regisztrált</div>' : ''}
                            ${registered.map((p, idx) => `
                                <div class="participant">
                                    <div class="participant-info">
                                        <div class="participant-name">${p.name}</div>
                                        ${p.email ? `<div class="participant-email">${p.email}</div>` : ''}
                                    </div>
                                    <button type="button" class="remove-btn" onclick="removeParticipant(${slot.id}, ${idx})">✕</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(slotDiv);
            });
        }

        // Modal megnyitása
        function openModal(slotId) {
            currentSlotId = slotId;
            const slot = TIMESLOTS.find(s => s.id === slotId);
            document.getElementById('modalTitle').textContent = `Regisztráció - ${slot.time}`;
            document.getElementById('nameInput').value = '';
            document.getElementById('emailInput').value = '';
            document.getElementById('registerModal').classList.add('active');
            document.getElementById('nameInput').focus();
        }

        // Modal bezárása
        function closeModal() {
            document.getElementById('registerModal').classList.remove('active');
            currentSlotId = null;
        }

        // Regisztráció beküldése
        async function submitRegistration(e) {
            e.preventDefault();
            const name = document.getElementById('nameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();

            if (name) {
                const slot = TIMESLOTS.find(s => s.id === currentSlotId);

                // Google Sheet-be küldés
                try {
                    const formData = new FormData();
                    formData.append('action', 'add');
                    formData.append('timeSlot', slot.time);
                    formData.append('name', name);
                    formData.append('email', email || '');

                    await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        payload: formData
                    });
                    console.log('✅ Regisztráció küldve a Google Sheet-be');
                    showStatus('✅ Regisztrálva!');
                } catch (error) {
                    console.log('Error küldés:', error);
                    showStatus('⚠️ Offline mód - csak lokálisan tárolódik', 'error');
                }

                // Lokálisan is hozzáadja
                registrations[currentSlotId].push({ name, email: email || '' });
                saveData();
                renderTimeslots();
                closeModal();
            }
        }

        // Résztvevő eltávolítása
        async function removeParticipant(slotId, idx) {
            if (!isAdminMode) {
                alert('❌ Admin jelszó szükséges!');
                return;
            }

            const slot = TIMESLOTS.find(s => s.id === slotId);
            const name = registrations[slotId][idx].name;

            // Google Sheet-ből törlés
            try {
                const formData = new FormData();
                formData.append('action', 'remove');
                formData.append('timeSlot', slot.time);
                formData.append('name', name);

                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    payload: formData
                });
                console.log('✅ Regisztráció törölve a Google Sheet-ből');
            } catch (error) {
                console.log('Error törlés:', error);
            }

            registrations[slotId].splice(idx, 1);
            saveData();
            renderTimeslots();
        }

        // Statisztika frissítése
        function updateStats() {
            let totalReg = 0;
            let totalSlots = 0;

            TIMESLOTS.forEach(slot => {
                const count = registrations[slot.id] ? registrations[slot.id].length : 0;
                totalReg += count;
                totalSlots += slot.maxSlots;
            });

            document.getElementById('total-registered').textContent = totalReg;
            document.getElementById('total-slots').textContent = totalSlots;
            document.getElementById('remaining-slots').textContent = totalSlots - totalReg;
        }

        // Export CSV-ként
        function exportToCSV() {
            let csv = 'Időpont,Név,Email\n';

            TIMESLOTS.forEach(slot => {
                const registered = registrations[slot.id] || [];
                if (registered.length === 0) {
                    csv += `${slot.time},(üres)\n`;
                } else {
                    registered.forEach((p, idx) => {
                        csv += `${idx === 0 ? slot.time : ''},${p.name},"${p.email || ''}"\n`;
                    });
                }
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `tenisz-nap-pilates-${new Date().toISOString().split('T')[0]}.csv`);
            link.click();
            showStatus('📥 CSV letöltve!');
        }

        // Másolás Google Sheets-hez
        function copyToClipboard() {
            let text = 'Időpont\tNév\tEmail\n';

            TIMESLOTS.forEach(slot => {
                const registered = registrations[slot.id] || [];
                if (registered.length === 0) {
                    text += `${slot.time}\t(üres)\n`;
                } else {
                    registered.forEach((p, idx) => {
                        text += `${idx === 0 ? slot.time : ''}\t${p.name}\t${p.email || ''}\n`;
                    });
                }
            });

            navigator.clipboard.writeText(text).then(() => {
                showStatus('✅ Vágólapra másolva! Sheets-be beszúrható!');
            });
        }

        // Összes törlése
        async function resetAll() {
            if (confirm('⚠️ Biztosan törlöd az ÖSSZES regisztrációt? Ez nem visszavonható!')) {
                // Google Sheet-ből törlés
                try {
                    const formData = new FormData();
                    formData.append('action', 'reset');

                    await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        payload: formData
                    });
                    console.log('✅ Összes regisztráció törölve');
                } catch (error) {
                    console.log('Error reset:', error);
                }

                TIMESLOTS.forEach(slot => {
                    registrations[slot.id] = [];
                });
                saveData();
                renderTimeslots();
                showStatus('🔄 Összes törlve!');
            }
        }

        // Modal bezárása escape-re
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Inicializálás betöltéskor
        init();
    </script>
</body>
</html>
