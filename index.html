<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenisz nap - Pilates óra regisztráció</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .admin-button-container {
            text-align: right;
            margin-bottom: 30px;
        }

        .admin-button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .admin-button:hover {
            background: #5a3680;
        }

        .timeslots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .timeslot-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid transparent;
        }

        .timeslot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .timeslot-card.full {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .timeslot-card.full:hover {
            transform: none;
            box-shadow: none;
        }

        .timeslot-time {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .timeslot-capacity {
            font-size: 14px;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .participant-list {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            max-height: 200px;
            overflow-y: auto;
        }

        .participant-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .participant-item:last-child {
            border-bottom: none;
        }

        .participant-name {
            flex: 1;
        }

        .delete-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            margin-left: 8px;
        }

        .delete-btn:hover {
            background: rgba(255, 0, 0, 0.5);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 450px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .success-message {
            color: #27ae60;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: #f0fff4;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .offline-message {
            color: #e67e22;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: #fff8f0;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .offline-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .export-button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            margin-top: 20px;
            width: 100%;
        }

        .export-button:hover {
            background: #229954;
        }

        .admin-actions {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ddd;
        }

        .admin-actions button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            width: 100%;
        }

        .admin-actions button:hover {
            background: #c0392b;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .timeslots-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎾 Tenisz nap - Pilates óra</h1>
            <p>Válaszd ki az időpontot és regisztrálj</p>
        </div>

        <div class="admin-button-container">
            <button class="admin-button" onclick="openAdminModal()">⚙️ Admin</button>
        </div>

        <div class="timeslots-grid" id="timeslotsGrid"></div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="export-button" onclick="exportToCSV()">📥 Exportálás CSV-be</button>
        </div>
    </div>

    <!-- Registration Modal -->
    <div class="modal" id="registrationModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeRegistrationModal()">×</button>
            <h2>Regisztráció</h2>
            <form id="registrationForm" onsubmit="submitRegistration(event)">
                <div class="form-group">
                    <label for="participantName">Teljes név *</label>
                    <input type="text" id="participantName" name="name" required placeholder="Add meg a neved">
                </div>
                <div class="form-group">
                    <label for="participantEmail">E-mail cím *</label>
                    <input type="email" id="participantEmail" name="email" required placeholder="Add meg az e-mail címed">
                </div>
                <div class="success-message" id="successMessage">
                    ✓ Sikeres regisztráció! Az oldal azonnal frissül...
                </div>
                <div class="offline-message" id="offlineMessage">
                    ⚠️ Offline mód: az adatok helyileg tárolódnak
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Regisztráció</button>
                    <button type="button" class="btn btn-secondary" onclick="closeRegistrationModal()">Mégse</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeAdminModal()">×</button>
            <h2>Admin Panel</h2>
            <form onsubmit="submitAdminLogin(event)">
                <div class="form-group">
                    <label for="adminPassword">Jelszó</label>
                    <input type="password" id="adminPassword" placeholder="Add meg az admin jelszót">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Bejelentkezés</button>
                    <button type="button" class="btn btn-secondary" onclick="closeAdminModal()">Mégse</button>
                </div>
            </form>
            <div id="adminPanel" style="display: none;">
                <div class="admin-actions">
                    <button onclick="resetAllRegistrations()">🗑️ Összes regisztráció törlése</button>
                    <button onclick="exitAdminMode()" style="background: #95a5a6; margin-top: 10px;">🔓 Kilépés az admin módból</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzmd_EqsQpJBL1fyMsvaqPaDb1JfDOBIZQdLKm2KmMZTV0xrsS8CKt-HxUdb_AIGSf/exec';

        let registrations = {};
        let currentSlotId = null;
        let adminLoggedIn = false;  // Admin jelszó védelme

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            await loadRegistrations();
            renderTimeslots();

            // Auto-refresh minden 5 másodpercben
            setInterval(async () => {
                await loadRegistrations();
                renderTimeslots();
            }, 5000);
        });

        async function loadRegistrations() {
            try {
                console.log('loadRegistrations: Fetching from getAll...');
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getAll`);
                const data = await response.json();
                console.log('loadRegistrations: Response from getAll:', data);

                // Ha az adatok közvetlenül az registrations objektum (van "0", "1", "2" kulcs)
                if (data["0"] !== undefined || data["1"] !== undefined || data["2"] !== undefined) {
                    registrations = data;
                    console.log('✅ Registrations loaded (direct)');
                }
                // Ha az adatok a registrations field-ben vannak
                else if (data.success && data.registrations) {
                    registrations = data.registrations;
                    console.log('✅ Registrations loaded (field)');
                }
                // Fallback
                else if (data.registrations) {
                    registrations = data.registrations;
                    console.log('✅ Registrations loaded (fallback)');
                } else {
                    throw new Error('Invalid response format: ' + JSON.stringify(data));
                }

                localStorage.setItem('pilatesRegistrations', JSON.stringify(registrations));
            } catch (error) {
                console.error('Error loading registrations:', error);
                const saved = localStorage.getItem('pilatesRegistrations');
                registrations = saved ? JSON.parse(saved) : { "0": [], "1": [], "2": [] };
            }
        }

        function renderTimeslots() {
            const grid = document.getElementById('timeslotsGrid');
            grid.innerHTML = '';

            const slots = [
                { id: '0', time: '9:00 - 9:50' },
                { id: '1', time: '10:00 - 10:50' },
                { id: '2', time: '11:00 - 11:50' }
            ];

            slots.forEach(slot => {
                const slotKey = String(slot.id);
                const participants = registrations[slotKey] || [];
                const isFull = participants.length >= 6;

                const card = document.createElement('div');
                card.className = `timeslot-card ${isFull ? 'full' : ''}`;
                card.onclick = () => !isFull && openRegistrationModal(slot.id);

                let participantHTML = '';
                participants.forEach((p, idx) => {
                    participantHTML += `
                        <div class="participant-item">
                            <div style="flex: 1;">
                                <div class="participant-name">${p.name}</div>
                                ${p.email ? `<div style="font-size: 10px; color: white; opacity: 0.85; margin-top: 2px;">${p.email}</div>` : ''}
                            </div>
                            <button type="button" class="delete-btn" onclick="deleteParticipant('${slotKey}', ${idx}, event)">×</button>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="timeslot-time">${slot.time}</div>
                    <div class="timeslot-capacity">
                        ${participants.length}/6 hely foglalt
                    </div>
                    <div class="participant-list">
                        ${participantHTML || '<em>Még nincs regisztrált</em>'}
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function openRegistrationModal(slotId) {
            currentSlotId = slotId;
            document.getElementById('registrationModal').classList.add('active');
            document.getElementById('participantName').focus();
        }

        function closeRegistrationModal() {
            document.getElementById('registrationModal').classList.remove('active');
            document.getElementById('registrationForm').reset();
            document.getElementById('successMessage').classList.remove('show');
            document.getElementById('offlineMessage').classList.remove('show');
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').textContent = 'Regisztráció';
            currentSlotId = null;
        }

        function openAdminModal() {
            document.getElementById('adminModal').classList.add('active');
            document.getElementById('adminPassword').focus();
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
            document.getElementById('adminPassword').value = '';
        }

        function exitAdminMode() {
            adminLoggedIn = false;  // Kijelentkezés
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('adminPassword').value = '';
            closeAdminModal();
        }

        async function submitRegistration(event) {
            event.preventDefault();

            const name = document.getElementById('participantName').value.trim();
            if (!name) {
                alert('Kérlek add meg a neved!');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Küldés folyamatban...';

            const email = document.getElementById('participantEmail').value.trim();
            const successMsg = document.getElementById('successMessage');
            const offlineMsg = document.getElementById('offlineMessage');

            try {
                console.log('submitRegistration started, slotId:', currentSlotId, 'name:', name);

                const url = `${APPS_SCRIPT_URL}?action=add&slotId=${currentSlotId}&name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`;
                console.log('Fetching from:', url);

                const response = await Promise.race([
                    fetch(url),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 10000))
                ]);

                console.log('Response received:', response.status);
                const data = await response.json();
                console.log('Server response:', data);

                if (data.success) {
                    console.log('Registration successful! Reloading fresh data...');
                    successMsg.classList.add('show');
                    offlineMsg.classList.remove('show');

                    // Frissen lekérjük az összes adatot az Apps Script-ből
                    await loadRegistrations();

                    setTimeout(() => {
                        console.log('Closing modal and rendering with fresh data...');
                        closeRegistrationModal();
                        renderTimeslots();
                    }, 300);
                } else {
                    throw new Error(data.error || 'Server returned success: false');
                }
            } catch (error) {
                console.error('Error occurred:', error.message);

                // Hibaüzenet alert-ben
                alert('⚠️ ' + error.message);

                submitBtn.disabled = false;
                submitBtn.textContent = 'Regisztráció';
            } finally {
                // Biztonsági reset gomb
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Regisztráció';
                }, 2000);
            }
        }

        function deleteParticipant(slotId, index, event) {
            event.stopPropagation();

            if (!adminLoggedIn) {
                alert('🔒 Admin jelszó szükséges a törléshez!');
                return;
            }

            if (confirm('Biztosan kitörlöd ezt a regisztrációt?')) {
                fetch(`${APPS_SCRIPT_URL}?action=remove&slotId=${slotId}&index=${index}`)
                    .then(r => r.json())
                    .then(data => {
                        registrations = data.registrations || registrations;
                        localStorage.setItem('pilatesRegistrations', JSON.stringify(registrations));
                        renderTimeslots();
                    })
                    .catch(() => {
                        registrations[slotId].splice(index, 1);
                        localStorage.setItem('pilatesRegistrations', JSON.stringify(registrations));
                        renderTimeslots();
                    });
            }
        }

        function submitAdminLogin(event) {
            event.preventDefault();
            const password = document.getElementById('adminPassword').value.trim();
            if (password === 'admin123') {
                adminLoggedIn = true;  // Bejelentkezés flag
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('adminPassword').value = '';
            } else {
                alert('Hibás jelszó! A helyes jelszó: admin123');
            }
        }

        async function resetAllRegistrations() {
            if (confirm('Biztosan törlöd az ÖSSZES regisztrációt? Ez nem vonható vissza!')) {
                try {
                    const response = await fetch(`${APPS_SCRIPT_URL}?action=reset`);
                    const data = await response.json();
                    registrations = data.registrations || { "0": [], "1": [], "2": [] };
                    localStorage.setItem('pilatesRegistrations', JSON.stringify(registrations));
                    renderTimeslots();
                    closeAdminModal();
                    alert('Összes regisztráció törölve!');
                } catch (error) {
                    console.error('Error resetting:', error);
                    registrations = { "0": [], "1": [], "2": [] };
                    localStorage.setItem('pilatesRegistrations', JSON.stringify(registrations));
                    renderTimeslots();
                    closeAdminModal();
                }
            }
        }

        function exportToCSV() {
            let csv = 'Időpont,Név,E-mail\n';

            const slotTimes = {
                '0': '9:00-9:50',
                '1': '10:00-10:50',
                '2': '11:00-11:50'
            };

            Object.keys(registrations).forEach(slotId => {
                const time = slotTimes[slotId];
                registrations[slotId].forEach(p => {
                    csv += `"${time}","${p.name}","${p.email || ''}"\n`;
                });
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `pilates_registrations_${new Date().toISOString().split('T')[0]}.csv`);
            link.click();
        }
    </script>
</body>
</html>
