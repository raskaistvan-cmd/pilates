<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenisz nap - Pilates Regisztráció</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            color-scheme: light;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .timeslots {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .timeslot {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .timeslot:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .timeslot-time {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }
        .timeslot-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .slot-count {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .slot-count label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        .slot-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }
        .slot-number.full {
            color: #e74c3c;
        }
        .register-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .register-btn:hover:not(:disabled) {
            background: #764ba2;
        }
        .register-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .participants {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }
        .participants-title {
            font-size: 1em;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .participant-list {
            max-height: 250px;
            overflow-y: auto;
        }
        .participant {
            font-size: 0.95em;
            padding: 10px 10px;
            margin-bottom: 8px;
            color: #333;
            border-bottom: none;
            border-radius: 6px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .participant:hover {
            background: #f0f0f5;
        }
        .participant:last-child {
            border-bottom: none;
        }
        .participant-name {
            font-weight: 600;
            color: #667eea;
        }
        .participant-info {
            flex: 1;
        }
        .participant-email {
            font-size: 0.85em;
            color: #999;
            margin-top: 3px;
        }
        .remove-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.8em;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .participant:hover .remove-btn {
            opacity: 1;
        }
        .remove-btn:hover {
            background: #c0392b;
        }
        .remove-btn.hidden {
            display: none;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal-buttons .confirm-btn {
            background: #667eea;
            color: white;
        }
        .modal-buttons .confirm-btn:hover {
            background: #764ba2;
        }
        .modal-buttons .cancel-btn {
            background: #eee;
            color: #333;
        }
        .modal-buttons .cancel-btn:hover {
            background: #ddd;
        }
        /* Export section */
        .export-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .export-section h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .export-btn {
            padding: 12px 30px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        .export-btn:hover {
            background: #229954;
        }
        .reset-btn {
            padding: 12px 30px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        .reset-btn:hover {
            background: #c0392b;
        }
        .admin-toggle-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .admin-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .admin-controls {
            display: none;
        }
        .admin-controls.active {
            display: block;
        }
        .logout-btn {
            padding: 8px 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
        .stats {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        .status-message {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: none;
        }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }
            .timeslots {
                grid-template-columns: 1fr;
            }
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <!-- Google Apps Script API URL -->
    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhFRcJajTDhB0AIK2eJJ5yX_Irpq0LZ9Xkez-ENznVhs3tDU_UCevHo4zipQNShmlU/exec';
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎾 Tenisz nap - Pilates óra</h1>
            <p>Regisztrálj az alábbi időpontok közül</p>
            <div style="margin-top: 15px;">
                <button id="adminToggleBtn" class="admin-toggle-btn" onclick="toggleAdminPanel()">🔐 Admin belépés</button>
                <span id="adminStatus" style="color: #fff; margin-left: 10px; display: none;">✅ Admin mód aktív</span>
            </div>
        </div>
        <div id="statusMessage" class="status-message"></div>
        <div class="timeslots" id="timeslots"></div>
        <div class="export-section">
            <h3>📊 Regisztrációs adatok</h3>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="total-registered">0</div>
                    <div class="stat-label">Össz. regisztrált</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="total-slots">18</div>
                    <div class="stat-label">Össz. hely</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="remaining-slots">18</div>
                    <div class="stat-label">Szabad hely</div>
                </div>
            </div>
            <div id="adminControls" class="admin-controls">
                <hr style="margin: 20px 0; border: none; border-top: 2px solid #f0f0f0;">
                <h4 style="color: #667eea; margin-bottom: 15px;">🔐 Admin Funkciók</h4>
                <button class="export-btn" onclick="exportToCSV()">📥 Letöltés (CSV)</button>
                <button class="export-btn" onclick="copyToClipboard()">📋 Másolás (Sheets-hez)</button>
                <button class="reset-btn" onclick="resetAll()">🔄 Összes törlése</button>
                <button class="logout-btn" onclick="logoutAdmin()">🔓 Kijelentkezés</button>
            </div>
        </div>
    </div>
    <!-- Regisztrációs modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle"></div>
            <form onsubmit="submitRegistration(event)">
                <div class="form-group">
                    <label for="nameInput">Név *</label>
                    <input type="text" id="nameInput" required placeholder="pl. Kiss János">
                </div>
                <div class="form-group">
                    <label for="emailInput">Email (opcionális)</label>
                    <input type="email" id="emailInput" placeholder="janos@example.com">
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="confirm-btn">Regisztrálok</button>
                    <button type="button" class="cancel-btn" onclick="closeModal()">Mégse</button>
                </div>
            </form>
        </div>
    </div>
    <!-- Admin Login Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">🔐 Admin Belépés</div>
            <form onsubmit="submitAdminPassword(event)">
                <div class="form-group">
                    <label for="adminPassword">Jelszó</label>
                    <input type="password" id="adminPassword" required placeholder="Add meg az admin jelszót" autofocus>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="confirm-btn">Belépés</button>
                    <button type="button" class="cancel-btn" onclick="closeAdminModal()">Mégse</button>
                </div>
            </form>
            <div id="adminError" style="color: #e74c3c; margin-top: 15px; text-align: center; display: none;">
                ❌ Hibás jelszó! Próbáld újra.
            </div>
        </div>
    </div>
    <script>
        // Adatstruktúra
        const TIMESLOTS = [
            { id: 0, time: '9:00-9:50', maxSlots: 6 },
            { id: 1, time: '10:00-10:50', maxSlots: 6 },
            { id: 2, time: '11:00-11:50', maxSlots: 6 }
        ];
        let registrations = {};
        let currentSlotId = null;
        let isAdminMode = false;
        const ADMIN_PASSWORD = 'admin123';
        // Status üzenet megjelenítése
        function showStatus(message, type = 'success') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            setTimeout(() => {
                statusEl.className = 'status-message';
            }, 3000);
        }
        // Inicializálás
        async function init() {
            await loadData();
            renderTimeslots();
            updateStats();
            updateAdminUI();
        }
        // Admin panel megnyitása
        function toggleAdminPanel() {
            document.getElementById('adminModal').classList.add('active');
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminError').style.display = 'none';
        }
        // Admin
