<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenisz nap - Pilates óra regisztráció</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 900px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 30px;
    }

    .section {
      margin-bottom: 30px;
    }

    .section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .slot-card {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .slot-card:hover {
      border-color: #667eea;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
      transform: translateY(-2px);
    }

    .slot-card.selected {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .slot-time {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .slot-count {
      font-size: 14px;
      opacity: 0.7;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #e9ecef;
      color: #333;
    }

    .btn-secondary:hover {
      background: #dee2e6;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .participants-list {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    .participant-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: white;
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 4px solid #667eea;
    }

    .participant-name {
      font-weight: 500;
      color: #333;
    }

    .participant-delete {
      background: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.3s;
    }

    .participant-delete:hover {
      background: #c82333;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-content h3 {
      color: #333;
      margin-bottom: 15px;
    }

    .modal-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
    }

    .admin-panel {
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
    }

    .admin-panel h3 {
      color: #856404;
      margin-bottom: 15px;
    }

    .admin-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .admin-buttons button {
      flex: 1;
      min-width: 150px;
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      border-radius: 8px;
      padding: 12px;
      margin-top: 15px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 12px;
      margin-top: 15px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .status-text {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 22px;
      }

      .slots-grid {
        grid-template-columns: 1fr;
      }

      .button-group {
        flex-direction: column;
      }

      .admin-buttons {
        flex-direction: column;
      }

      .admin-buttons button {
        min-width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎾 Tenisz nap - Pilates óra</h1>
      <p>Regisztráció az osztályokra</p>
    </div>

    <div class="content">
      <!-- Regisztráció szakasz -->
      <div class="section">
        <h2>1️⃣ Válassz időpontot</h2>
        <div class="slots-grid">
          <div class="slot-card" onclick="selectSlot(0)">
            <div class="slot-time">09:00 - 09:50</div>
            <div class="slot-count"><span id="count-0">0</span>/6 fő</div>
          </div>
          <div class="slot-card" onclick="selectSlot(1)">
            <div class="slot-time">10:00 - 10:50</div>
            <div class="slot-count"><span id="count-1">0</span>/6 fő</div>
          </div>
          <div class="slot-card" onclick="selectSlot(2)">
            <div class="slot-time">11:00 - 11:50</div>
            <div class="slot-count"><span id="count-2">0</span>/6 fő</div>
          </div>
        </div>
      </div>

      <!-- Regisztrációs forma -->
      <div class="section">
        <h2>2️⃣ Add meg a nevedet</h2>
        <div class="form-group">
          <label for="nameInput">Teljes név:</label>
          <input
            type="text"
            id="nameInput"
            placeholder="Pl: Kovács János"
            onkeypress="if(event.key==='Enter') submitRegistration()"
          >
        </div>

        <div class="button-group">
          <button class="btn-primary" onclick="submitRegistration()">✅ Regisztráció</button>
          <button class="btn-secondary" onclick="clearForm()">🔄 Törlés</button>
        </div>

        <div class="success-message" id="successMessage">
          ✅ Sikeres regisztráció!
        </div>
        <div class="error-message" id="errorMessage"></div>
      </div>

      <!-- Résztvevő lista -->
      <div class="section">
        <h2>📋 Regisztráltak</h2>
        <div id="registrationsList"></div>
      </div>

      <!-- Admin panel -->
      <div class="admin-panel">
        <h3>🔐 Admin panel</h3>
        <div class="admin-buttons">
          <button class="btn-danger" onclick="openAdminPanel()">Admin belépés</button>
          <button class="btn-secondary" onclick="exportToCSV()">📥 CSV letöltés</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Admin bejelentkezés Modal -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <h3>Admin panel - Jelszó</h3>
      <input
        type="password"
        class="modal-input"
        id="adminPassword"
        placeholder="Jelszó"
        onkeypress="if(event.key==='Enter') verifyAdminPassword()"
      >
      <div class="modal-buttons">
        <button class="btn-primary" onclick="verifyAdminPassword()">Belépés</button>
        <button class="btn-secondary" onclick="closeAdminModal()">Mégse</button>
      </div>
    </div>
  </div>

  <!-- Admin funkciók Modal -->
  <div class="modal" id="adminFunctionModal">
    <div class="modal-content">
      <h3>Admin funkciók</h3>
      <div class="admin-buttons" style="flex-direction: column;">
        <button class="btn-danger" onclick="resetAllRegistrations()">🗑️ Összes törlése</button>
        <button class="btn-secondary" onclick="closeAdminFunctionModal()">❌ Bezárás</button>
        <button class="btn-secondary" onclick="exitAdminMode()">🔓 Kilépés az admin módból</button>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx9jESHsGuSCylzWkK7ACa5KT8BThkTXOAD3VUBlsoxlhQnM_IWWy2E6Fk8i1xvXgU/exec';
    const ADMIN_PASSWORD = 'admin123';

    let selectedSlot = null;
    let registrations = { "0": [], "1": [], "2": [] };
    let adminLoggedIn = false;

    // Oldal betöltésekor
    window.addEventListener('DOMContentLoaded', () => {
      loadRegistrations();
      setInterval(loadRegistrations, 5000);
    });

    // Regisztrációk betöltése
    async function loadRegistrations() {
      try {
        const response = await fetch(APPS_SCRIPT_URL + '?action=add');
        const data = await response.json();
        registrations = data;
        renderTimeslots();
        renderParticipants();
      } catch (error) {
        console.log('Offline mód');
      }
    }

    // Időpontok megjelenítése
    function renderTimeslots() {
      for (let i = 0; i < 3; i++) {
        const count = registrations[String(i)].length;
        document.getElementById('count-' + i).textContent = count;
      }
    }

    // Résztvevők megjelenítése
    function renderParticipants() {
      let html = '';
      for (let slotId = 0; slotId < 3; slotId++) {
        const slot = registrations[String(slotId)];
        const times = ['09:00 - 09:50', '10:00 - 10:50', '11:00 - 11:50'];

        html += '<div style="margin-bottom: 20px;">';
        html += '<h3 style="color: #667eea; margin-bottom: 10px;">' + times[slotId] + '</h3>';

        if (slot.length === 0) {
          html += '<p style="color: #999;">Még nincs regisztrált résztvevő</p>';
        } else {
          html += '<div class="participants-list">';
          slot.forEach((participant, index) => {
            html += '<div class="participant-item">';
            html += '<span class="participant-name">' + participant.name + '</span>';
            if (adminLoggedIn) {
              html += '<button class="participant-delete" onclick="deleteParticipant(' + slotId + ', ' + index + ')">❌ Törlés</button>';
            }
            html += '</div>';
          });
          html += '</div>';
        }
        html += '</div>';
      }
      document.getElementById('registrationsList').innerHTML = html;
    }

    // Időpont kiválasztása
    function selectSlot(slotId) {
      selectedSlot = slotId;
      document.querySelectorAll('.slot-card').forEach((card, index) => {
        card.classList.remove('selected');
        if (index === slotId) {
          card.classList.add('selected');
        }
      });
    }

    // Regisztráció beküldése
    async function submitRegistration() {
      if (selectedSlot === null) {
        showError('Válassz egy időpontot!');
        return;
      }

      const name = document.getElementById('nameInput').value.trim();
      if (!name) {
        showError('Add meg a nevedet!');
        return;
      }

      // ✅ KAPACITÁS ELLENŐRZÉS
      const currentCount = registrations[String(selectedSlot)].length;
      if (currentCount >= 6) {
        showError('Ez az időpont már megtelt! (6/6 fő)');
        return;
      }

      try {
        const url = APPS_SCRIPT_URL + '?action=add&slotId=' + selectedSlot + '&name=' + encodeURIComponent(name);
        const response = await fetch(url);
        const data = await response.json();

        if (data.success) {
          showSuccess('Sikeres regisztráció!');
          registrations = data;
          renderTimeslots();
          renderParticipants();
          clearForm();
        } else {
          showError(data.error || 'Hiba történt!');
        }
      } catch (error) {
        showError('Hiba a regisztráció során!');
      }
    }

    // Résztvevő törlése (admin)
    async function deleteParticipant(slotId, index) {
      if (!adminLoggedIn) {
        showError('Admin jogok szükségesek!');
        return;
      }

      if (!confirm('Biztosan törlöd ezt a regisztrációt?')) return;

      try {
        const url = APPS_SCRIPT_URL + '?action=remove&slotId=' + slotId + '&index=' + index;
        const response = await fetch(url);
        const data = await response.json();

        registrations = data;
        renderTimeslots();
        renderParticipants();
      } catch (error) {
        showError('Hiba a törlés során!');
      }
    }

    // Összes törlése (admin)
    async function resetAllRegistrations() {
      if (!adminLoggedIn) {
        showError('Admin jogok szükségesek!');
        return;
      }

      if (!confirm('BIZTOSAN törlöd az ÖSSZES regisztrációt?')) return;

      try {
        const url = APPS_SCRIPT_URL + '?action=reset';
        const response = await fetch(url);
        const data = await response.json();

        registrations = data;
        renderTimeslots();
        renderParticipants();
        showSuccess('Összes regisztráció törlésre került!');
        exitAdminMode();
      } catch (error) {
        showError('Hiba a törlés során!');
      }
    }

    // Admin modal megnyitása
    function openAdminPanel() {
      document.getElementById('adminModal').classList.add('active');
      document.getElementById('adminPassword').focus();
    }

    // Admin jelszó ellenőrzése
    function verifyAdminPassword() {
      const password = document.getElementById('adminPassword').value;
      if (password === ADMIN_PASSWORD) {
        adminLoggedIn = true;
        closeAdminModal();
        document.getElementById('adminFunctionModal').classList.add('active');
        renderParticipants();
      } else {
        alert('Hibás jelszó!');
        document.getElementById('adminPassword').value = '';
      }
    }

    // Admin modal bezárása
    function closeAdminModal() {
      document.getElementById('adminModal').classList.remove('active');
      document.getElementById('adminPassword').value = '';
    }

    // Admin funkciók modal bezárása (de admin mód marad aktív)
    function closeAdminFunctionModal() {
      document.getElementById('adminFunctionModal').classList.remove('active');
    }

    // Admin módból kilépés
    function exitAdminMode() {
      adminLoggedIn = false;
      document.getElementById('adminFunctionModal').classList.remove('active');
      renderParticipants();
    }

    // Forma törlése
    function clearForm() {
      document.getElementById('nameInput').value = '';
      selectedSlot = null;
      document.querySelectorAll('.slot-card').forEach(card => {
        card.classList.remove('selected');
      });
      hideMessages();
    }

    // Üzenetek megjelenítése
    function showSuccess(message) {
      const el = document.getElementById('successMessage');
      el.textContent = message;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function showError(message) {
      const el = document.getElementById('errorMessage');
      el.textContent = '❌ ' + message;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function hideMessages() {
      document.getElementById('successMessage').classList.remove('show');
      document.getElementById('errorMessage').classList.remove('show');
    }

    // CSV exportálás
    function exportToCSV() {
      let csv = 'Időpont,Név\n';
      const times = ['09:00-09:50', '10:00-10:50', '11:00-11:50'];

      for (let slotId = 0; slotId < 3; slotId++) {
        const slot = registrations[String(slotId)];
        slot.forEach(participant => {
          csv += times[slotId] + ',"' + participant.name + '"\n';
        });
      }

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'pilates_regisztracio.csv';
      a.click();
      window.URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
