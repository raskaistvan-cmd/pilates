<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenisz nap - Pilates óra regisztráció</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #9333ea;
            --primary-dark: #7e22ce;
            --primary-light: #c084fc;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .slot-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .slot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .slot-time {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .slot-capacity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        .capacity-bar {
            flex: 1;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .capacity-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transition: width 0.3s ease;
        }

        .capacity-text {
            font-weight: 600;
            color: var(--text-dark);
            min-width: 40px;
            text-align: right;
        }

        .participants-list {
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            background: #f9fafb;
        }

        .participant {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9em;
        }

        .participant:last-child {
            border-bottom: none;
        }

        .participant-name {
            font-weight: 500;
            color: var(--text-dark);
        }

        .participant-email {
            color: var(--text-light);
            font-size: 0.85em;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--error);
            cursor: pointer;
            font-size: 1.2em;
            padding: 0 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .participant:hover .delete-btn {
            opacity: 1;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .register-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(147, 51, 234, 0.4);
        }

        .register-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #000;
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-dark);
            padding-right: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            flex: 1;
            padding: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: scale(1.02);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-cancel {
            flex: 1;
            padding: 10px;
            background: var(--border);
            color: var(--text-dark);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background: #d1d5db;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .control-btn {
            padding: 10px 20px;
            background: white;
            color: var(--text-dark);
            border: 2px solid white;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .message.info {
            background: #dbeafe;
            color: #1e40af;
            display: block;
        }

        .offline-banner {
            background: #fef3c7;
            color: #92400e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .offline-banner.show {
            display: block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .slots-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .control-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎾 Tenisz nap - Pilates óra</h1>
            <p>Regisztrálj az óra időpontodra!</p>
        </div>

        <div id="message" class="message"></div>
        <div id="offlineBanner" class="offline-banner">⚠️ Offline mód - az adatok helyileg tárolódnak</div>

        <div class="controls">
            <button class="control-btn" onclick="toggleAdminLogin()">🔐 Admin Bejelentkezés</button>
            <button class="control-btn" onclick="exportCSV()">📥 CSV Letöltés</button>
        </div>

        <div id="timeslots" class="slots-grid"></div>
    </div>

    <div id="registrationModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="forceCloseModal()">✕</button>
            <div class="modal-header" id="modalTitle">Regisztráció</div>
            <form id="regForm" onsubmit="submitRegistration(event)">
                <div class="form-group">
                    <label for="nameInput">Név *</label>
                    <input type="text" id="nameInput" required placeholder="Add meg a nevedet">
                </div>
                <div class="form-group">
                    <label for="emailInput">Email cím</label>
                    <input type="email" id="emailInput" placeholder="add meg az email-ed (opcionális)">
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-submit">Regisztrálás</button>
                    <button type="button" class="btn-cancel" onclick="forceCloseModal()">Mégsem</button>
                </div>
            </form>
        </div>
    </div>

    <div id="adminModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAdminModal()">✕</button>
            <div class="modal-header">Admin Bejelentkezés</div>
            <form onsubmit="submitAdminLogin(event)">
                <div class="form-group">
                    <label for="adminPassword">Jelszó</label>
                    <input type="password" id="adminPassword" required placeholder="Add meg az admin jelszót">
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-submit">Bejelentkezés</button>
                    <button type="button" class="btn-cancel" onclick="closeAdminModal()">Mégsem</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwVqzBzEgbVTWmIhUEQ4kTN1Hv2dgpq8Pt1YQuQJM-Uh0jclfSUMmXpyfD8OFMDo2xT/exec';
        const ADMIN_PASSWORD = 'admin123';

        let currentSlotId = null;
        let adminMode = false;
        let registrations = {};

        const timeslots = {
            0: '9:00 - 9:50',
            1: '10:00 - 10:50',
            2: '11:00 - 11:50'
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadRegistrations();
            renderTimeslots();
        });

        async function loadRegistrations() {
            try {
                const url = APPS_SCRIPT_URL + '?action=getAll';
                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    registrations = data || {};
                    delete registrations.success;
                    renderTimeslots();
                } else {
                    throw new Error('API error');
                }
            } catch (error) {
                document.getElementById('offlineBanner').classList.add('show');
                loadFromLocalStorage();
            }
        }

        function renderTimeslots() {
            const container = document.getElementById('timeslots');
            container.innerHTML = '';

            Object.keys(timeslots).forEach(slotId => {
                const time = timeslots[slotId];
                const participants = registrations[String(slotId)] || [];
                const capacity = 6;
                const filled = participants.length;
                const percentage = (filled / capacity) * 100;
                const isFull = filled >= capacity;

                const card = document.createElement('div');
                card.className = 'slot-card';
                card.innerHTML = `
                    <div class="slot-time">${time}</div>
                    <div class="slot-capacity">
                        <div class="capacity-bar">
                            <div class="capacity-fill" style="width: ${percentage}%"></div>
                        </div>
                        <div class="capacity-text">${filled}/${capacity}</div>
                    </div>
                    <div class="participants-list">
                        ${participants.length === 0 ? '<em style="color: var(--text-light);">Még senki nem regisztrált</em>' : ''}
                        ${participants.map((p, idx) => `
                            <div class="participant">
                                <div>
                                    <div class="participant-name">${escapeHtml(p.name)}</div>
                                    ${p.email ? `<div class="participant-email">${escapeHtml(p.email)}</div>` : ''}
                                </div>
                                ${adminMode ? `<button type="button" class="delete-btn" onclick="deleteParticipant('${slotId}', ${idx})">✕</button>` : ''}
                            </div>
                        `).join('')}
                    </div>
                    <button class="register-btn" onclick="openModal(${slotId})" ${isFull ? 'disabled' : ''}>
                        ${isFull ? '❌ Megtelt' : '✅ Regisztrálás'}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function openModal(slotId) {
            currentSlotId = slotId;
            document.getElementById('modalTitle').textContent = `Regisztráció - ${timeslots[slotId]}`;
            document.getElementById('nameInput').value = '';
            document.getElementById('emailInput').value = '';
            document.getElementById('registrationModal').classList.add('active');
            document.getElementById('nameInput').focus();
        }

        function forceCloseModal() {
            const modal = document.getElementById('registrationModal');
            modal.classList.remove('active');
            document.getElementById('regForm').reset();
            currentSlotId = null;
        }

        async function submitRegistration(event) {
            event.preventDefault();

            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Küldés...';

            const name = document.getElementById('nameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();

            if (!name) {
                showMessage('A név megadása kötelező!', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Regisztrálás';
                return;
            }

            const slotKey = String(currentSlotId);

            try {
                const url = new URL(APPS_SCRIPT_URL);
                url.searchParams.append('action', 'add');
                url.searchParams.append('slotId', currentSlotId);
                url.searchParams.append('name', name);
                url.searchParams.append('email', email || '');

                const response = await fetch(url.toString());
                const data = await response.json();

                if (data.success) {
                    if (!registrations[slotKey]) {
                        registrations[slotKey] = [];
                    }
                    registrations[slotKey].push({ name, email: email || '' });
                    saveToLocalStorage();
                    showMessage(`✅ Sikeresen regisztráltál!`, 'success');
                    renderTimeslots();
                    forceCloseModal();
                } else {
                    throw new Error(data.message || 'Hiba');
                }
            } catch (error) {
                if (!registrations[slotKey]) {
                    registrations[slotKey] = [];
                }
                registrations[slotKey].push({ name, email: email || '' });
                saveToLocalStorage();
                document.getElementById('offlineBanner').classList.add('show');
                showMessage('⚠️ Offline módban regisztráltál!', 'info');
                renderTimeslots();
                forceCloseModal();
            }
        }

        async function deleteParticipant(slotId, index) {
            if (!adminMode) {
                showMessage('Ehhez admin jog szükséges!', 'error');
                return;
            }

            if (!confirm('Biztosan törlöd?')) return;

            try {
                const url = new URL(APPS_SCRIPT_URL);
                url.searchParams.append('action', 'remove');
                url.searchParams.append('slotId', slotId);
                url.searchParams.append('index', index);

                const response = await fetch(url.toString());
                const data = await response.json();

                if (data.success) {
                    const slotKey = String(slotId);
                    if (registrations[slotKey]) {
                        registrations[slotKey].splice(index, 1);
                    }
                    saveToLocalStorage();
                    showMessage('✅ Törölve', 'success');
                    renderTimeslots();
                }
            } catch (error) {
                showMessage('❌ Hiba', 'error');
            }
        }

        function toggleAdminLogin() {
            document.getElementById('adminModal').classList.add('active');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
            document.getElementById('adminPassword').value = '';
        }

        function submitAdminLogin(event) {
            event.preventDefault();
            const password = document.getElementById('adminPassword').value;

            if (password === ADMIN_PASSWORD) {
                adminMode = true;
                showMessage('✅ Admin mód', 'success');
                closeAdminModal();
                renderTimeslots();
            } else {
                showMessage('❌ Helytelen jelszó', 'error');
            }
        }

        function exportCSV() {
            let csv = 'Időpont,Név,Email\n';
            Object.keys(timeslots).forEach(slotId => {
                const time = timeslots[slotId];
                const participants = registrations[String(slotId)] || [];
                participants.forEach(p => {
                    csv += `"${time}","${p.name}","${p.email}"\n`;
                });
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'pilates.csv';
            link.click();
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('pilates_registrations', JSON.stringify(registrations));
            } catch (e) {}
        }

        function loadFromLocalStorage() {
            try {
                const data = localStorage.getItem('pilates_registrations');
                if (data) registrations = JSON.parse(data);
            } catch (e) {}
        }

        function showMessage(text, type) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = `message ${type}`;
            setTimeout(() => {
                msgEl.className = 'message';
            }, 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
