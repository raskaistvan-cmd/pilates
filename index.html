<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenisz nap - Pilates óra regisztráció</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 16px;
        }
        .timeslots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .timeslot-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .timeslot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .timeslot-card.full {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .timeslot-time {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .timeslot-capacity {
            font-size: 14px;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        .participant-list {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            max-height: 150px;
            overflow-y: auto;
        }
        .participant-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .participant-item:last-child {
            border-bottom: none;
        }
        .delete-btn {
            background: rgba(255, 0, 0, 0.3);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .delete-btn:hover {
            background: rgba(255, 0, 0, 0.6);
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: #fadbd8;
            border-radius: 8px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .admin-button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .export-button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 30px;
            width: 100%;
        }
        .admin-actions {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ddd;
        }
        .admin-actions.show {
            display: block;
        }
        .admin-actions button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎾 Tenisz nap - Pilates óra</h1>
            <p>Válaszd ki az időpontot és regisztrálj</p>
        </div>
        <div style="text-align: right; margin-bottom: 20px;">
            <button class="admin-button" onclick="openAdminModal()">⚙️ Admin</button>
            <button class="export-button" onclick="exportToCSV()">📥 Exportálás CSV-be</button>
        </div>
        <div class="timeslots-grid" id="timeslotsGrid"></div>
    </div>
    <!-- Registration Modal -->
    <div class="modal" id="registrationModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeRegistrationModal()">×</button>
            <h2>Regisztráció</h2>
            <form onsubmit="submitRegistration(event)">
                <div class="form-group">
                    <label for="participantName">Teljes név *</label>
                    <input type="text" id="participantName" required placeholder="Add meg a neved">
                </div>
                <div class="form-group">
                    <label for="participantEmail">E-mail cím *</label>
                    <input type="email" id="participantEmail" required placeholder="Add meg az e-mail címed">
                </div>
                <div class="error-message" id="errorMessage"></div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Regisztráció</button>
                    <button type="button" class="btn btn-secondary" onclick="closeRegistrationModal()">Mégse</button>
                </div>
            </form>
        </div>
    </div>
    <!-- Admin Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeAdminModal()">×</button>
            <h2>Admin Panel</h2>
            <form onsubmit="submitAdminLogin(event)">
                <div class="form-group">
                    <label for="adminPassword">Jelszó</label>
                    <input type="password" id="adminPassword" placeholder="admin123">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Bejelentkezés</button>
                    <button type="button" class="btn btn-secondary" onclick="closeAdminModal()">Mégse</button>
                </div>
            </form>
            <div class="admin-actions" id="adminActions">
                <button onclick="resetAllRegistrations()">🗑️ Összes törlése</button>
                <button onclick="exitAdminMode()" style="background: #95a5a6;">🔓 Kilépés</button>
            </div>
        </div>
    </div>
    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzfYL7Anagx6BJkUAhbE4axqvx1jNCUEw3nmX_qBgpG3EMtMGMsRJ7Di314jW2gRttx/exec';
        let registrations = { "0": [], "1": [], "2": [] };
        let currentSlotId = null;
        let adminLoggedIn = false;
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await loadRegistrations();
            renderTimeslots();
            setInterval(loadRegistrations, 5000);
        });
        async function loadRegistrations() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                console.log('loadRegistrations:', data);
                if (data["0"] !== undefined) {
                    registrations = data;
                    renderTimeslots();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        function renderTimeslots() {
            const grid = document.getElementById('timeslotsGrid');
            grid.innerHTML = '';
            const slots = [
                { id: '0', time: '9:00 - 9:50' },
                { id: '1', time: '10:00 - 10:50' },
                { id: '2', time: '11:00 - 11:50' }
            ];
            slots.forEach(slot => {
                const participants = registrations[slot.id] || [];
                const isFull = participants.length >= 6;
                let participantHTML = '';
                participants.forEach((p, idx) => {
                    participantHTML += `
                        <div class="participant-item">
                            <span>${p.name}</span>
                            <button type="button" class="delete-btn" onclick="deleteParticipant('${slot.id}', ${idx}, event)">×</button>
                        </div>
                    `;
                });
                const card = document.createElement('div');
                card.className = `timeslot-card ${isFull ? 'full' : ''}`;
                card.onclick = () => !isFull && openRegistrationModal(slot.id);
                card.innerHTML = `
                    <div class="timeslot-time">${slot.time}</div>
                    <div class="timeslot-capacity">${participants.length}/6 hely foglalt</div>
                    <div class="participant-list">
                        ${participantHTML || '<em>Még nincs regisztrált</em>'}
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        function openRegistrationModal(slotId) {
            currentSlotId = slotId;
            document.getElementById('registrationModal').classList.add('active');
            document.getElementById('participantName').focus();
        }
        function closeRegistrationModal() {
            document.getElementById('registrationModal').classList.remove('active');
            document.getElementById('registrationForm').reset();
            document.getElementById('errorMessage').classList.remove('show');
            currentSlotId = null;
        }
        async function submitRegistration(event) {
            event.preventDefault();
            const name = document.getElementById('participantName').value.trim();
            const email = document.getElementById('participantEmail').value.trim();
            if (!name) {
                showError('Add meg a neved!');
                return;
            }
            if (!email) {
                showError('Add meg az email-t!');
                return;
            }
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Küldés...';
            try {
                console.log('submitRegistration:', { slotId: currentSlotId, name, email });
                const url = `${APPS_SCRIPT_URL}?action=add&slotId=${currentSlotId}&name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`;
                console.log('Fetching:', url);
                const response = await fetch(url);
                const data = await response.json();
                console.log('Response:', data);
                if (data.success === false) {
                    showError(data.error || 'Hiba a regisztráció során!');
                } else {
                    registrations = data;
                    closeRegistrationModal();
                    renderTimeslots();
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Hiba a regisztráció során!');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Regisztráció';
            }
        }
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = '❌ ' + message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 4000);
        }
        function deleteParticipant(slotId, index, event) {
            event.stopPropagation();
            if (!adminLoggedIn) {
                alert('🔒 Admin jelszó szükséges!');
                return;
            }
            if (confirm('Biztosan törlöd?')) {
                const url = `${APPS_SCRIPT_URL}?action=remove&slotId=${slotId}&index=${index}`;
                fetch(url)
                    .then(r => r.json())
                    .then(data => {
                        registrations = data;
                        renderTimeslots();
                    });
            }
        }
        function openAdminModal() {
            document.getElementById('adminModal').classList.add('active');
            document.getElementById('adminPassword').focus();
        }
        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
            document.getElementById('adminPassword').value = '';
        }
        function submitAdminLogin(event) {
            event.preventDefault();
            const password = document.getElementById('adminPassword').value;
            if (password === 'admin123') {
                adminLoggedIn = true;
                document.getElementById('adminActions').classList.add('show');
                document.getElementById('adminPassword').value = '';
            } else {
                alert('Hibás jelszó!');
            }
        }
        function exitAdminMode() {
            adminLoggedIn = false;
            document.getElementById('adminActions').classList.remove('show');
            closeAdminModal();
        }
        async function resetAllRegistrations() {
            if (confirm('BIZTOSAN törlöd az ÖSSZES regisztrációt?')) {
                const url = `${APPS_SCRIPT_URL}?action=reset`;
                const response = await fetch(url);
                const data = await response.json();
                registrations = data;
                renderTimeslots();
                closeAdminModal();
                alert('Összes törlésre került!');
            }
        }
        function exportToCSV() {
            let csv = 'Időpont,Név,E-mail\n';
            const slotTimes = { '0': '9:00-9:50', '1': '10:00-10:50', '2': '11:00-11:50' };
            Object.keys(registrations).forEach(slotId => {
                registrations[slotId].forEach(p => {
                    csv += `"${slotTimes[slotId]}","${p.name}","${p.email}"\n`;
                });
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'pilates.csv';
            link.click();
        }
    </script>
</body>
</html>
